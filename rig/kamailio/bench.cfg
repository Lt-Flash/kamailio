#!KAMAILIO
#
# ndb_tarantool PR #4913 - like-for-like bench config.
# Exactly ONE backend define per run:
#   kamailio -f bench.cfg -A WITH_TNT        ndb_tarantool (the PR)
#   kamailio -f bench.cfg -A WITH_REDIS      ndb_redis, FCALL functions (fair arm)
#   kamailio -f bench.cfg -A WITH_REDIS_FT   ndb_redis, Redis 8 Query Engine (CDR only)
#   kamailio -f bench.cfg -A WITH_REDIS_SCAN ndb_redis, full-list scan (strawman, CDR only)
#   kamailio -f bench.cfg -A WITH_REDIS_NAIVE  ndb_redis, read-then-write LCR (strawman)
#   kamailio -f bench.cfg -A WITH_TNT -A TNT_YIELD  lcr_acquire_yield (positive control)
#
# Request routing by R-URI user (SIPp -s):
#   none  -> no backend call                                 (SIPp + Kamailio ceiling)
#   noop  -> one empty round trip to the backend           (transport floor)
#   cdr   -> newest 20 CDR ids of $fU                      (scenario 1)
#   lcr   -> acquire a trunk, relay to it, release on BYE/failure (scenario 3)
# noop/cdr reply statelessly; X-R carries the result for correctness checks.

#!define BENCH_CHILDREN 8

debug=1
log_stderror=no
log_facility=LOG_LOCAL0
children=BENCH_CHILDREN
tcp_children=0
disable_tcp=yes
listen=udp:127.0.0.1:5060
auto_aliases=no

mpath="/opt/kamailio/lib64/kamailio/modules/"

loadmodule "pv.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "maxfwd.so"
loadmodule "siputils.so"
loadmodule "jansson.so"

#!ifdef WITH_TNT
loadmodule "ndb_tarantool.so"
modparam("ndb_tarantool", "server", "name=default;addr=127.0.0.1;port=13301;user=kam;pass=kampass")
modparam("ndb_tarantool", "cmd_timeout", 1000)
#!else
loadmodule "ndb_redis.so"
modparam("ndb_redis", "server", "name=r;addr=127.0.0.1;port=16399")
modparam("ndb_redis", "cmd_timeout", 1000)
#!endif

modparam("tm", "fr_timer", 8000)
modparam("rr", "append_fromtag", 0)

request_route {
	if(!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }

	if(has_totag()) {
		if(loose_route()) {
			if(is_method("BYE")) route(LCR_RELEASE);
			t_relay();
			exit;
		}
		if(is_method("ACK") && t_check_trans()) { t_relay(); exit; }
		sl_send_reply("404", "Not Here");
		exit;
	}
	if(is_method("CANCEL")) { if(t_check_trans()) t_relay(); exit; }
	if(is_method("ACK")) exit;

	if($rU == "none") route(NONE);
	if($rU == "noop") route(NOOP);
	if($rU == "cdr") route(CDR);
	if($rU =~ "^lcr") route(LCR);
	sl_send_reply("404", "Unknown Test");
	exit;
}

# No backend at all: the SIPp + Kamailio ceiling every other arm is read against.
route[NONE] {
	append_to_reply("X-R: 0\r\n");
	sl_send_reply("480", "None Done");
	exit;
}

route[NOOP] {
#!ifdef WITH_TNT
	if(!tarantool_call("noop", "[]", "$var(r)")) { sl_send_reply("503", "Backend"); exit; }
#!else
	if(!redis_cmd("r", "FCALL noop 0", "rr")) { sl_send_reply("503", "Backend"); exit; }
	$var(r) = $redis(rr=>value);
#!endif
	append_to_reply("X-R: $var(r)\r\n");
	sl_send_reply("480", "Noop Done");
	exit;
}

# Same work on every arm: one round trip, server returns 20 comma-joined ids.
route[CDR] {
#!ifdef WITH_TNT
	if(!tarantool_call("cdr_by_src", "[\"$fU\", 20]", "$var(j)")) { sl_send_reply("503", "Backend"); exit; }
	jansson_get("[0]", "$var(j)", "$var(r)");
#!else
#!ifdef WITH_REDIS_FT
	if(!redis_cmd("r", "FT.SEARCH idx:cdr @src:{%s} SORTBY ts DESC LIMIT 0 20 NOCONTENT", "$fU", "rr")) { sl_send_reply("503", "Backend"); exit; }
	$var(r) = $redis(rr=>size);
#!else
#!ifdef WITH_REDIS_SCAN
	if(!redis_cmd("r", "FCALL cdr_scan 1 cdrs:all %s 20", "$fU", "rr")) { sl_send_reply("503", "Backend"); exit; }
#!else
	if(!redis_cmd("r", "FCALL cdr_by_src 1 cdr:src:%s 20", "$fU", "rr")) { sl_send_reply("503", "Backend"); exit; }
#!endif
	$var(r) = $redis(rr=>value);
#!endif
#!endif
	append_to_reply("X-R: $var(r)\r\n");
	sl_send_reply("480", "CDR Done");
	exit;
}

route[LCR] {
	$var(t) = 0;
#!ifdef WITH_TNT
#!ifdef TNT_YIELD
	$var(p) = "lcr_acquire_yield";
#!else
	$var(p) = "lcr_acquire";
#!endif
	if(!tarantool_call("$var(p)", "[\"$ci\"]", "$var(j)")) { sl_send_reply("503", "Backend"); exit; }
	jansson_get("[0]", "$var(j)", "$var(t)");
#!else
#!ifdef WITH_REDIS_NAIVE
	# STRAWMAN: count, then add, in two round trips - races across workers by design.
	$var(i) = 1;
	while($var(i) <= 3) {
		redis_cmd("r", "SCARD trunk:$var(i):calls", "rr");
		$var(lim) = 15;
		if($var(i) == 2) $var(lim) = 35;
		if($var(i) == 3) $var(lim) = 50;
		if($redis(rr=>value) < $var(lim)) {
			redis_cmd("r", "SADD trunk:$var(i):calls %s", "$ci", "rr");
			redis_cmd("r", "HSET resv %s $var(i)", "$ci", "rr");
			$var(t) = $var(i);
			break;
		}
		$var(i) = $var(i) + 1;
	}
#!else
	if(!redis_cmd("r", "FCALL lcr_acquire 4 resv trunk:1:calls trunk:2:calls trunk:3:calls %s 15 35 50", "$ci", "rr")) { sl_send_reply("503", "Backend"); exit; }
	$var(t) = $redis(rr=>value);
#!endif
#!endif
	if($var(t) == 0) { sl_send_reply("503", "All Trunks Full"); exit; }
	$du = "sip:127.0.0.1:" + (5070 + $var(t));
	record_route();
	t_on_failure("LCR_FAIL");
	t_relay();
	exit;
}

route[LCR_RELEASE] {
#!ifdef WITH_TNT
	tarantool_call("lcr_release", "[\"$ci\"]", "$var(j)");
#!else
	redis_cmd("r", "FCALL lcr_release 4 resv trunk:1:calls trunk:2:calls trunk:3:calls %s", "$ci", "rr");
#!endif
}

failure_route[LCR_FAIL] {
	route(LCR_RELEASE);
}
