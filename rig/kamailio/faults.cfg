#!KAMAILIO
#
# ndb_tarantool PR #4913 - correctness/robustness probes (Phase 1).
# One SIP request per probe; R-URI user picks the probe; reply 200 carries
#   X-RC: <module return code>   X-R: <result variable>
# Drive with:  sipp 127.0.0.1:5060 -sf ../sipp/probe.xml -s <probe> -m 1 [-key callid <cid>]
# Tarantool must run tarantool/init.lua (echo/slow/big/fail/nothing/multi procs).

debug=2
log_stderror=yes
# One worker: the disable/timeout counters are per process, so one process keeps
# P5/P6 deterministic.
children=1
disable_tcp=yes
listen=udp:127.0.0.1:5060

mpath="/opt/kamailio/lib64/kamailio/modules/"

loadmodule "pv.so"
loadmodule "sl.so"
loadmodule "textops.so"
loadmodule "xlog.so"

loadmodule "ndb_tarantool.so"
modparam("ndb_tarantool", "server", "name=default;addr=127.0.0.1;port=13301;user=kam;pass=kampass")
# Short timeouts so the timeout probes run in seconds.
modparam("ndb_tarantool", "server", "name=short;addr=127.0.0.1;port=13301;user=kam;pass=kampass;cmd_timeout=300;allowed_timeouts=3;disable_time=10")
# Nothing listens on 13399: connect failures.
modparam("ndb_tarantool", "server", "name=dead;addr=127.0.0.1;port=13399;connect_timeout=300;allowed_timeouts=3;disable_time=10")
modparam("ndb_tarantool", "init_without_tarantool", 1)

request_route {
	if(!is_method("OPTIONS")) { sl_send_reply("405", "OPTIONS only"); exit; }
	$var(rc) = 0; $var(r) = "";
	if($rU == "p_types") route(p_types);
	else if($rU == "p_inject") route(p_inject);
	else if($rU == "p_unicode") route(p_unicode);
	else if($rU == "p_badjson") route(p_badjson);
	else if($rU == "p_badjson2") route(p_badjson2);
	else if($rU == "p_after") route(p_after);
	else if($rU == "p_slow") route(p_slow);
	else if($rU == "p_short_ok") route(p_short_ok);
	else if($rU == "p_dead") route(p_dead);
	else if($rU == "p_big") route(p_big);
	else if($rU == "p_bigx") route(p_bigx);
	else if($rU == "p_huge") route(p_huge);
	else if($rU == "p_seq_a") route(p_seq_a);
	else if($rU == "p_seq_b") route(p_seq_b);
	else if($rU == "p_err") route(p_err);
	else if($rU == "p_nil") route(p_nil);
	else if($rU == "p_multi") route(p_multi);
	else { sl_send_reply("404", "Unknown Probe"); exit; }
	append_to_reply("X-RC: $var(rc)\r\nX-R: $var(r)\r\n");
	sl_send_reply("200", "Probe Done");
	exit;
}

# P1 - type coercion of a bare (unbracketed) parameter. Send with a Call-ID that
# starts with digits, e.g. 0123abc@h. Correct: ["string","0123abc@h"].
route[p_types] {
	tarantool_call("echo", "$ci", "$var(r)");
	$var(rc) = $rc;
}

# P2 - parameter injection through a SIP header (Call-ID may legally contain
# DQUOTE, [ ] { }). Send Call-ID  x","injected  . Correct: ONE string argument.
route[p_inject] {
	tarantool_call("echo", "[\"$ci\"]", "$var(r)");
	$var(rc) = $rc;
}

# P3 - \u escapes outside ASCII. Correct: ["string","Ж"].
route[p_unicode] {
	tarantool_call("echo", "[\"\\u0416\"]", "$var(r)");
	$var(rc) = $rc;
}

# P4 - malformed JSON params. Correct: rc=-1 without a request on the wire, and
# the NEXT call (p_after) still answers its own question.
route[p_badjson] {
	tarantool_call("echo", "[1,", "$var(r)");
	$var(rc) = $rc;
}
route[p_badjson2] {
	tarantool_call("echo", "[1 2]", "$var(r)");
	$var(rc) = $rc;
}
route[p_after] {
	tarantool_eval("return 'after'", "[]", "$var(r)");
	$var(rc) = $rc;
}

# P5 - command timeout on a live server. Docs: disabled after allowed_timeouts.
# Fire 6 in a row; count 'marked disabled' in the log and the time per probe.
route[p_slow] {
	tarantool_call_srv("short", "slow", "[2]", "$var(r)");
	$var(rc) = $rc;
}
route[p_short_ok] {
	tarantool_eval_srv("short", "return 'ok'", "[]", "$var(r)");
	$var(rc) = $rc;
}

# P6 - connect failures (positive control for the disable path).
route[p_dead] {
	tarantool_call_srv("dead", "noop", "[]", "$var(r)");
	$var(rc) = $rc;
}

# P7 - big results. 900000 bytes fits the 1 MiB frame limit; run kamailio with
# -M 2 (2 MB pkg) so the JSON copy cannot fit. Then p_seq_a / p_seq_b must
# return "a" and "b" - anything else means the socket is out of step.
route[p_big] {
	tarantool_call("big", "[900000]", "$var(r)");
	$var(rc) = $rc;
	$var(r) = $(var(r){s.len});
}
# P7c - sized big result: the Call-ID is the size in bytes (sipp -cid_str 600000).
route[p_bigx] {
	tarantool_call("big", "[$ci]", "$var(r)");
	$var(rc) = $rc;
	$var(r) = $(var(r){s.len});
}
route[p_huge] {
	tarantool_call("big", "[1100000]", "$var(r)");
	$var(rc) = $rc;
	$var(r) = $(var(r){s.len});
}
route[p_seq_a] {
	tarantool_eval("return 'a'", "[]", "$var(r)");
	$var(rc) = $rc;
}
route[p_seq_b] {
	tarantool_eval("return 'b'", "[]", "$var(r)");
	$var(rc) = $rc;
}

# P8 - result shapes: Lua error, nil, multiple returns.
route[p_err] {
	tarantool_call("fail", "[]", "$var(r)");
	$var(rc) = $rc;
}
route[p_nil] {
	tarantool_call("nothing", "[]", "$var(r)");
	$var(rc) = $rc;
}
route[p_multi] {
	tarantool_call("multi", "[]", "$var(r)");
	$var(rc) = $rc;
}
